<title>Universe Apocalypse</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#000;
    overflow:hidden;
    font-family:monospace;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
    image-rendering:pixelated;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#hud{
    position:absolute;
    left:8px;
    top:8px;
    color:#fff;
    font-size:16px;
    line-height:20px;
}

#menu{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
    z-index:1000;
}

    font-size:34px;

}

    width:220px;
    height:28px;
    font-size:14px;
    border:2px solid #888;
    background:#222;
    color:white;
}

#menu button:disabled{
    background:#111;
    color:#666;
    border-color:#444;
}

.chapter.active{
    border-color:#0ff;
    color:#0ff;
}
#chapterSelect{
    display:flex;
    flex-direction:column;
    gap:18px;
}
#characterSelect{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.character{
    width:220px;
    height:28px;
    font-size:14px;
}

.character.active{
    border-color:#0ff;
    color:#0ff;
}

.character:disabled{
    background:#111;
    color:#555;
    border-color:#333;
}
#characterList{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
}

#characterList .character{
    display:block;
    width:200px;
    margin:5px auto;
}
#controls{
    position:fixed;
    left:12px;
    bottom:12px;
    width:180px;
    height:180px;
    pointer-events:auto;
}

#controls button,
#skill{
    position:absolute;
    width:56px;
    height:56px;
    font-size:22px;
    border:2px solid #888;
    background:#222;
    color:#fff;
    cursor:pointer;
    opacity:0.45;
}
#skillCd{
    position:fixed;

    bottom:125px;
    width:90px;

    color:#0ff;
    font-size:14px;

#up{

#left{
    left:0;
    top:62px;

#right{
    left:124px;
    top:62px;
}

#down{

#skill{
    position:fixed;
    right:18px;
    bottom:28px;
    width:90px;
    height:90px;
    font-size:18px;
    pointer-events:auto;

button:active{

let moveUp=false;
let moveDown=false;
let moveLeft=false;
let moveRight=false;

function bindButton(id,key){

    const btn=document.getElementById(id);

    function set(v){
        switch(key){
            case "up": moveUp=v; break;
            case "down": moveDown=v; break;
            case "left": moveLeft=v; break;
            case "right": moveRight=v; break;
        }
    }

    btn.onpointerdown=()=>set(true);

    btn.onpointerup=
    btn.onpointerleave=
    btn.onpointercancel=()=>set(false);

}

bindButton("up","up");
bindButton("down","down");
bindButton("left","left");
bindButton("right","right");

// =====================================================
// PC KEYBOARD CONTROLS
// WASD / ARROW = MOVE
// X = SKILL
// Z / SPACE = NEXT DIALOGUE
// =====================================================

document.addEventListener("keydown",e=>{

    // Chặn trình duyệt cuộn trang bằng phím
    if([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        " ",
        "w","a","s","d",
        "W","A","S","D",
        "x","X",
        "z","Z"
    ].includes(e.key)){
        e.preventDefault();
    }

    // =========================
    // NEXT DIALOGUE - Z / SPACE
    // =========================
    if(e.key==="z" || e.key==="Z" || e.key===" "){

        if(dialogueActive){
            nextDialogue();
        }

        return;
    }

    // =========================
    // SKILL - X
    // =========================
    if(e.key==="x" || e.key==="X"){

        if(dialogueActive) return;
        if(skillCooldown>0) return;

        activateSkill();

        return;
    }

    // =========================
    // MOVE
    // =========================
    if(e.key==="w" || e.key==="W" || e.key==="ArrowUp"){
        moveUp=true;
    }

    if(e.key==="s" || e.key==="S" || e.key==="ArrowDown"){
        moveDown=true;
    }

    if(e.key==="a" || e.key==="A" || e.key==="ArrowLeft"){
        moveLeft=true;
    }

    if(e.key==="d" || e.key==="D" || e.key==="ArrowRight"){
        moveRight=true;
    }

});


document.addEventListener("keyup",e=>{

    if(e.key==="w" || e.key==="W" || e.key==="8" || e.key==="ArrowUp"){
        moveUp=false;
    }

    if(e.key==="s" || e.key==="S" || e.key==="2" || e.key==="ArrowDown"){
        moveDown=false;
    }

    if(e.key==="a" || e.key==="A" || e.key==="4" || e.key==="ArrowLeft"){
        moveLeft=false;
    }

    if(e.key==="d" || e.key==="D" || e.key==="6" || e.key==="ArrowRight"){
        moveRight=false;
    }

});

function selectCharacter(name,img,btn){

    playableName=name;
    playableImg=img;

    applyCharacterStats();

    document
        .querySelectorAll(".character")
        .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    const startBtn = document.getElementById("startBtn");
    if (chapter === 3 && (playableName==="Lunemi" || playableName==="Tsukina")) {
        startBtn.disabled = true;
    }else{
        startBtn.disabled = false;
}
}

// =====================================================
// GET DIALOGUE FOR CURRENT PLAYABLE
// =====================================================

function getBossDialogue(stage,type){

    const data=bossDialogues[stage];

    if(!data)
        return [];

    const section=data[type];

    if(!section)
        return [];

    const currentPlayable=getPlayableName();

    if(section[currentPlayable])
        return section[currentPlayable];

    if(section.Renka)
        return section.Renka;

    if(section.Merivelle)
        return section.Merivelle;

    const keys=Object.keys(section);

    if(keys.length>0)
        return section[keys[0]];

    return [];
}


// =====================================================
// START DIALOGUE
// =====================================================

function startBossDialogue(stage,type){

    const lines=getBossDialogue(stage,type);

    if(!lines || lines.length===0)
        return;

    dialogueLines=lines;
    dialogueIndex=0;
    dialogueTimer=0;
    dialogueType=type;
    dialogueActive=true;
}


// =====================================================
// NEXT DIALOGUE
// =====================================================

function nextDialogue(){

    if(!dialogueActive)
        return;

    dialogueIndex++;

    if(dialogueIndex>=dialogueLines.length){

        dialogueActive=false;
        dialogueLines=[];
        dialogueIndex=0;
        dialogueTimer=0;

        return;
    }

    dialogueTimer=0;
}

function chapter15EnemyMove(){

    if(!ch15Boss)
        return;

    let difficulty=ch15Boss.aiLevel;

    ch15Boss.moveTimer--;

    if(ch15Boss.moveTimer<=0){

        ch15Boss.moveTimer=
            50+
            Math.random()*90;

        ch15Boss.moveTargetX=
            CH15_SPLIT+35+
            Math.random()*145;

        ch15Boss.moveTargetY=
            45+
            Math.random()*510;

    }

    let dx=
        ch15Boss.moveTargetX-
        ch15Boss.x;

    let dy=
        ch15Boss.moveTargetY-
        ch15Boss.y;

    let dist=Math.hypot(dx,dy);

    if(dist>2){

        let speed=
            0.7+
            difficulty*0.12;

        ch15Boss.x+=
            dx/dist*speed;

        ch15Boss.y+=
            dy/dist*speed;

    }

}

function chapter15EnemyDodge(){

    if(!ch15Boss)
        return;

    let difficulty=ch15Boss.aiLevel;

    if(ch15Boss.dodgeTimer>0)
        ch15Boss.dodgeTimer--;

    let nearest=null;
    let nearestDist=Infinity;

    for(const b of ch15PlayerBullets){

        if(!b.skill)
            continue;

        if(b.x<CH15_SPLIT)
            continue;

        let dx=b.x-ch15Boss.x;
        let dy=b.y-ch15Boss.y;

        let d=dx*dx+dy*dy;

        if(d<nearestDist){

            nearest=b;
            nearestDist=d;

        }

    }

    if(nearest){

        let danger=Math.sqrt(nearestDist);

        if(danger<75+difficulty*10){

            let dx=
                ch15Boss.x-
                nearest.x;

            let dy=
                ch15Boss.y-
                nearest.y;

            let dist=
                Math.max(
                    1,
                    Math.hypot(dx,dy)
                );

            let dodgeSpeed=
                1.5+
                difficulty*0.3;

            ch15Boss.x+=
                dx/dist*
                dodgeSpeed;

            ch15Boss.y+=
                dy/dist*
                dodgeSpeed;

            ch15Boss.dodgeTimer=20;

        }

    }

    for(const e of ch15EnemyTrash){

        let dx=e.x-ch15Boss.x;
        let dy=e.y-ch15Boss.y;

        let dist=Math.hypot(dx,dy);

        if(dist<55){

            let awayX=
                ch15Boss.x-e.x;

            let awayY=
                ch15Boss.y-e.y;

            let len=
                Math.max(
                    1,
                    Math.hypot(
                        awayX,
                        awayY
                    )
                );

            let dodgeSpeed=
                1.4+
                difficulty*0.2;

            ch15Boss.x+=
                awayX/len*
                dodgeSpeed;

            ch15Boss.y+=
                awayY/len*
                dodgeSpeed;

            ch15Boss.dodgeTimer=20;

        }

    }

}

function chapter15EnemyShoot(){

    if(!ch15Boss)
        return;

    ch15Boss.fireTimer--;

    let difficulty=ch15Boss.aiLevel;

function chapter15UpdateEnemyBullets(){

    for(let i=ch15EnemyBullets.length-1;i>=0;i--){

        let b=ch15EnemyBullets[i];

        if(!b){

            ch15EnemyBullets.splice(i,1);
            continue;

        }

        // MIREIKA - CHASE
        if(
            b.homing &&
            b.homingTime>0
        ){

            let targetAngle=
                Math.atan2(
                    player.y-b.y,
                    player.x-b.x
                );

            let currentAngle=
                Math.atan2(
                    b.vy,
                    b.vx
                );

            let diff=
                Math.atan2(
                    Math.sin(
                        targetAngle-currentAngle
                    ),
                    Math.cos(
                        targetAngle-currentAngle
                    )
                );

            let turn=0.018;

            if(diff>turn)
                diff=turn;

            if(diff<-turn)
                diff=-turn;

            currentAngle+=diff;

            let speed=
                Math.hypot(
                    b.vx,
                    b.vy
                );

            b.vx=
                Math.cos(currentAngle)*speed;

            b.vy=
                Math.sin(currentAngle)*speed;

            b.homingTime--;

        }

        // DREAM
        if(b.wave){

            b.waveTime+=0.08;

            let speed=
                Math.hypot(
                    b.vx,
                    b.vy
                );

            let angle=
                Math.atan2(
                    b.vy,
                    b.vx
                );

            angle+=
                Math.sin(
                    b.waveTime
                )*0.025;

            b.vx=
                Math.cos(angle)*speed;

            b.vy=
                Math.sin(angle)*speed;

        }

        // GENTLE
        if(b.gentle){

            b.vx*=0.998;
            b.vy*=0.998;

        }

b.x+=b.vx;

function chapter15Skill(){

    // =================================================
    // SKILL 1 - CŨ - 5 GIÂY
    // =================================================

    if(ch15SkillCooldown<=0){

        ch15SkillCooldown=300;
        ch15SkillFlash=20;

        // Xóa đạn rác ở phía PLAYER
        for(
            let i=ch15EnemyBullets.length-1;
            i>=0;
            i--
        ){

            let b=ch15EnemyBullets[i];

            if(b.x<CH15_SPLIT){

                ch15EnemyBullets.splice(i,1);

            }

        }

        let bossType=
            ch15Boss?
            ch15Boss.type:
            "star";

        for(let i=0;i<18;i++){

            let a=
                -Math.PI/2+
                (i-8.5)*0.10;

            ch15PlayerBullets.push({

                x:player.x+10,
                y:player.y,

                vx:Math.cos(a)*5.5,
                vy:Math.sin(a)*5.5,

                r:6,

                star:true,

                skill:true

            });

        }

        for(let i=0;i<5;i++){

            ch15PlayerBullets.push({

                x:player.x+10,
                y:
                    player.y+
                    (i-2)*10,

                vx:4.5,

                vy:
                    (i-2)*0.18,

                r:7,

                vine:true,

                skill:true

            });

        }

        if(bossType==="night"){

            for(let i=0;i<8;i++){

                ch15PlayerBullets.push({

                    x:player.x,
                    y:player.y,

                    vx:
                        4+
                        Math.random()*2,

                    vy:
                        (Math.random()-0.5)*3,

                    r:8,

                    star:true,

                    skill:true

                });

            }

        }

        return;

    }


    // =================================================
    // SKILL 2 - 10 GIÂY
    // BẮN RẤT NHIỀU ĐẠN
    // =================================================

    if(ch15SkillCooldown2<=0){

        ch15SkillCooldown2=600;
        ch15SkillFlash=20;

        // Xóa đạn rác bên player
        for(
            let i=ch15EnemyBullets.length-1;
            i>=0;
            i--
        ){

            let b=ch15EnemyBullets[i];

            if(b.x<CH15_SPLIT){

                ch15EnemyBullets.splice(i,1);

            }

        }

        // 45 đạn sao
        for(let i=0;i<45;i++){

            let a=
                -Math.PI/2+
                (i-22)*0.045;

            ch15PlayerBullets.push({

                x:player.x+10,
                y:player.y,

                vx:Math.cos(a)*6,
                vy:Math.sin(a)*6,

                r:6,

                star:true,

                skill:true

            });

        }

        // 15 dây leo
        for(let i=0;i<15;i++){

            ch15PlayerBullets.push({

                x:player.x+10,

                y:
                    player.y+
                    (i-7)*9,

                vx:
                    4.5+
                    i%3*0.5,

                vy:
                    (i-7)*0.12,

                r:7,

                vine:true,

                skill:true

            });

        }

        return;

    }


    // =================================================
    // SKILL 3 - 20 GIÂY
    // XẢ ĐẠN CỰC NHIỀU
    // =================================================

    if(ch15SkillCooldown3<=0){

        ch15SkillCooldown3=1200;
        ch15SkillFlash=20;

        // Xóa đạn rác bên player
        for(
            let i=ch15EnemyBullets.length-1;
            i>=0;
            i--
        ){

            let b=ch15EnemyBullets[i];

            if(b.x<CH15_SPLIT){

                ch15EnemyBullets.splice(i,1);

            }

        }

        // =============================================
        // 80 ĐẠN SAO - QUẠT RỘNG
        // =============================================

        for(let i=0;i<80;i++){

            let a=
                -Math.PI/2+
                (i-39.5)*0.035;

            let speed=
                5.5+
                (i%4)*0.5;

            ch15PlayerBullets.push({

                x:player.x+10,
                y:player.y,

                vx:Math.cos(a)*speed,
                vy:Math.sin(a)*speed,

                r:7,

                star:true,

                skill:true

            });

        }

        // =============================================
        // 30 DÂY LEO
        // =============================================

        for(let i=0;i<30;i++){

            let offset=
                (i-14.5)*6;

            ch15PlayerBullets.push({

                x:player.x+10,

                y:
                    player.y+
                    offset,

                vx:
                    4.5+
                    (i%5)*0.4,

                vy:
                    offset*0.015,

                r:8,

                vine:true,

                skill:true

            });

        }

        // =============================================
        // 20 ĐẠN SAO XOẮN
        // =============================================

        for(let i=0;i<20;i++){

            let a=
                i*Math.PI*2/20;

            ch15PlayerBullets.push({

                x:player.x,
                y:player.y,

                vx:Math.cos(a)*4,
                vy:Math.sin(a)*4,

                r:6,

                star:true,

                skill:true

            });

        }

    }

}

// =====================================================
// UPDATE TRASH
// =====================================================

function chapter15UpdateTrash(){

// =================================================
// PLAYER SIDE
// RƠI THẲNG XUỐNG
// =================================================

for(
    let i=ch15Trash.length-1;
    i>=0;
    i--
){

    let e=ch15Trash[i];

    // Rơi thẳng xuống
    e.y+=e.vy;

    e.fireTimer--;

    // =============================================
    // TRASH PLAYER BẮN AIM BOSS
    // =============================================

    if(
        e.fireTimer<=0 &&
        ch15Boss
    ){

        e.fireTimer=
            70+
            Math.random()*80;

        let a=Math.atan2(
            ch15Boss.y-e.y,
            ch15Boss.x-e.x
        );

        ch15PlayerBullets.push({

            x:e.x,
            y:e.y,

            vx:Math.cos(a)*2.5,
            vy:Math.sin(a)*2.5,

            r:3,

            // Đạn của trash
            trashShot:true

        });

    }

    // Rơi khỏi màn hình thì xóa
    if(e.y>630){

        ch15Trash.splice(i,1);

    }

}

    // =================================================
    // ENEMY SIDE
    // RƠI TỪ TRÊN XUỐNG
    // =================================================

    for(
        let i=ch15EnemyTrash.length-1;
        i>=0;
        i--
    ){

        let e=ch15EnemyTrash[i];

        e.x+=e.vx;
        e.y+=e.vy;

        // Chỉ giới hạn X
        if(e.x<225 || e.x>375)
            e.vx*=-1;

        e.fireTimer--;

        if(e.fireTimer<=0){

            e.fireTimer=
                70+
                Math.random()*80;

            let a=Math.atan2(
                player.y-e.y,
                player.x-e.x
            );

            ch15EnemyBullets.push({

                x:e.x,
                y:e.y,

                vx:Math.cos(a)*2.5,
                vy:Math.sin(a)*2.5,

                r:3,

                type:"trash",

                life:600

            });

        }

        // Rơi khỏi màn hình thì xóa
        if(e.y>630){

            ch15EnemyTrash.splice(i,1);

        }

    }

}

    // STAGE TRANSITION
    // ---------------------------------

        chapter15UpdateTransition();

        return;

    }

    ch15StageTimer++;
    ch15BossTimer++;

if(ch15SkillCooldown>0)
    ch15SkillCooldown--;

if(ch15SkillCooldown2>0)
    ch15SkillCooldown2--;

if(ch15SkillCooldown3>0)
    ch15SkillCooldown3--;

    if(ch15SkillFlash>0)
        ch15SkillFlash--;

    // ---------------------------------
    // SPAWN TRASH
    // ---------------------------------

    if(frame%90===0)
        chapter15SpawnPlayerTrash();

if(
    frame%
    Math.max(
        35,
        90-ch15Boss.aiLevel*8
    )===0
)
    chapter15SpawnEnemyTrash();

    // ---------------------------------
    // PLAYER
    // ---------------------------------

    if(moveUp)
        player.y-=player.speed;

    if(moveDown)
        player.y+=player.speed;

    if(moveLeft)
        player.x-=player.speed;

    if(moveRight)
        player.x+=player.speed;

    // PLAYER CHỈ Ở NỬA TRÁI

    player.x=Math.max(
        18,
        Math.min(
            CH15_SPLIT-18,
            player.x
        )
    );

    player.y=Math.max(
        18,
        Math.min(
            582,
            player.y
        )
    );

    chapter15PlayerShoot();

    // ---------------------------------
    // BOSS AI
    // ---------------------------------

    chapter15EnemyMove();

    chapter15EnemyDodge();

    chapter15EnemyShoot();

    chapter15BossPattern();

    // ---------------------------------
    // UPDATE
    // ---------------------------------

    chapter15UpdateTrash();

    chapter15UpdatePlayerBullets();

    chapter15UpdateEnemyBullets();

    applyCharacterStats(); 

    // ---------------------------------
    // BOSS CHỈ Ở NỬA PHẢI
    // ---------------------------------

    if(ch15Boss){

        ch15Boss.x=Math.max(
            CH15_SPLIT+20,
            Math.min(
                380,
                ch15Boss.x
            )
        );

            )
        );

function drawChapter15Bullet(b){

    ctx.save();

    if(b.star){

        ctx.fillStyle="#fff";
        ctx.shadowColor="#fff";
        ctx.shadowBlur=8;

        ctx.beginPath();

        for(let i=0;i<10;i++){

            let a=
                -Math.PI/2+
                i*Math.PI/5;

            let r=
                i%2===0?
                b.r:
                b.r*0.4;

            let x=
                b.x+
                Math.cos(a)*r;

            let y=
                b.y+
                Math.sin(a)*r;

            if(i===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);

        }

        ctx.closePath();

        ctx.fill();

    }

    else if(b.vine){

        ctx.strokeStyle="#6cff75";
        ctx.lineWidth=5;
        ctx.shadowColor="#6cff75";
        ctx.shadowBlur=8;

        ctx.beginPath();

        ctx.moveTo(
            b.x,
            b.y
        );

        ctx.lineTo(
            b.x-22,
            b.y-
            Math.sin(
                frame*0.15+b.y
            )*10
        );

        ctx.stroke();

    }

    else{

        if(b.type==="night")
            ctx.fillStyle="#25203d";

        else if(b.type==="blood")
            ctx.fillStyle="#b00035";

        else if(b.type==="star")
            ctx.fillStyle="#fff56b";

        else if(b.type==="gentle")
            ctx.fillStyle="#c9f7ff";

        else if(b.type==="chase")
            ctx.fillStyle="#ff8ccf";

        else if(b.type==="dream")
            ctx.fillStyle="#b38cff";

        else if(b.type==="dark")
            ctx.fillStyle="#25203d";

        else
            ctx.fillStyle="#fff";

        ctx.shadowColor=ctx.fillStyle;

        ctx.shadowBlur=
            b.darkGlow?
            14:
            5;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.restore();

}

                    word;

                if(
                    ctx.measureText(test).width>
                    maxWidth
                ){

                    if(current)
                        lines.push(current);

                    current=word;

                }else{

                    current=test;

                }

            }

            if(current)
                lines.push(current);

            // Vẽ từng dòng
            let textY=canvas.height-110;

            for(let i=0;i<lines.length;i++){

                ctx.fillText(
                    lines[i],
                    30,
                    textY+i*20
                );

            }

            ctx.restore();

    // =================================
    // HÀM VẼ CÂY NĂNG LƯỢNG
    // =================================

    function drawEnergyTree(x,y){

        let grow=
            Math.min(
                1,
                (120-skillTimer)/60
            );

        let height=
            30+
            grow*170;

        let sway=
            Math.sin(frame*0.08)*8;


        // -----------------------------
        // AURA
        // -----------------------------

        ctx.globalAlpha=0.22;

        ctx.strokeStyle="#55ff88";
        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.arc(
            x,
            y-height*0.45,
            35+grow*25,
            0,
            Math.PI*2
        );

        ctx.stroke();


        // -----------------------------
        // THÂN CÂY
        // -----------------------------

        ctx.globalAlpha=0.9;

        ctx.strokeStyle="#66ff99";
        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y+8
        );

        ctx.quadraticCurveTo(
            x+sway,
            y-height*0.45,
            x-sway,
            y-height
        );

        ctx.stroke();


        // -----------------------------
        // CÀNH LỚN
        // -----------------------------

        for(let i=0;i<6;i++){

            let side=
                i%2===0
                ?-1
                :1;

            let yy=
                y-height*(0.25+i*0.11);

            let len=
                25+
                grow*35;

            ctx.strokeStyle="#66ff99";
            ctx.lineWidth=4;

            ctx.beginPath();

            ctx.moveTo(
                x,
                yy
            );

            ctx.quadraticCurveTo(
                x+side*15,
                yy-15,
                x+side*len,
                yy-35
            );

            ctx.stroke();


            // -------------------------
            // LÁ NĂNG LƯỢNG
            // -------------------------

            ctx.fillStyle="#9affb8";

            for(let j=0;j<3;j++){

                let lx=
                    x+
                    side*
                    (
                        len*(j+1)/4
                    );

                let ly=
                    yy-
                    35*(j+1)/3;

                ctx.beginPath();

                ctx.ellipse(
                    lx,
                    ly,
                    9,
                    5,
                    side*0.5,
                    0,
                    Math.PI*2
                );

                ctx.fill();
            }

        }


        // -----------------------------
        // NĂNG LƯỢNG BAY RA
        // -----------------------------

        for(let i=0;i<10;i++){

            let a=
                frame*0.04+
                i*Math.PI*2/10;

            let r=
                20+
                (
                    (frame*2+i*23)%80
                );

            let px=
                x+
                Math.cos(a)*r;

            let py=
                y-height*0.55+
                Math.sin(a)*r*0.5;

            ctx.globalAlpha=0.7;

            ctx.fillStyle="#aaffc0";

            ctx.beginPath();

            ctx.arc(
                px,
                py,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    // =================================
    // CÂY CỦA PLAYER
    // =================================

    drawEnergyTree(
        player.x,
        player.y
    );


    // =================================
    // CÂY CỦA CLONE
    // =================================

    drawEnergyTree(
        cloneX,
        cloneY
    );


    // =================================
    // ĐƯỜNG NĂNG LƯỢNG NỐI 2 BÊN
    // =================================

    ctx.globalAlpha=0.5;

    ctx.strokeStyle="#77ffaa";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        cloneX,
        cloneY
    );

    ctx.stroke();


    ctx.restore();

ctx.fillStyle = "white";
ctx.globalCompositeOperation = "difference";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.globalCompositeOperation = "source-over";
}
}
function loop(){

    if(!inMenu){

        if(!gameOver || dialogueActive){

            if(chapter15Mode){

                if(!dialogueActive) {
                    updateChapter15();
                }
                drawChapter15();

            } else {

                if(!dialogueActive) {
                    update();
                }
                draw();
            }

            if(!dialogueActive)
                frame++;
        }

    }else{

        ctx.fillStyle="#000";
        ctx.fillRect(0,0,canvas.width,canvas.height);

    }

    requestAnimationFrame(loop);
}
